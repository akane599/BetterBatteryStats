plugins {
    alias(libs.plugins.android.application)
}

// The Play Publisher plugin needs a service-account credentials file that only CI has, and its
// tasks fail at configuration time without one. It is declared in the root build and applied here
// only when the credentials are actually present, so local and offline builds are unaffected.
def playCredentials = file('sa-google-play.json')
if (playCredentials.exists()) {
    apply plugin: libs.plugins.play.publisher.get().pluginId
    play {
        track = 'beta'
        serviceAccountCredentials = playCredentials
    }
}

android {
    namespace 'com.asksven.betterbatterystats'
    compileSdk libs.versions.compileSdk.get() as int
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId "com.asksven.betterbatterystats"
        minSdk libs.versions.minSdk.get() as int
        targetSdk libs.versions.targetSdk.get() as int
        versionCode 109
        versionName "3.5.0"
        versionNameSuffix = getBuildSuffix()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testBuildType "debug"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    // The keystores are decrypted by CI and are not in the repository. Pointing a signing config at
    // a file that is not there makes the task fail at packaging time, so `assembleRelease` could
    // not be run at all — not even to check that the build and R8 configuration are sound. Each
    // config is only wired up when its keystore is actually present; the variant is otherwise built
    // unsigned.
    signingConfigs {
        release {
            def releaseKeystore = file(System.getenv("KEYSTORE_RELEASE") ?: "app.keystore")
            if (releaseKeystore.exists()) {
                storeFile = releaseKeystore
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            }
        }
        debug {
            def debugKeystore = file(System.getenv("KEYSTORE_DEBUG") ?: "app.keystore")
            if (debugKeystore.exists()) {
                storeFile = debugKeystore
            }
        }
    }

    // we have different package name for the variants
    flavorDimensions += "edition"
    productFlavors {
        gplay {
            dimension "edition"
            applicationId "com.asksven.betterbatterystats"
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        xdaedition {
            dimension "edition"
            applicationId "com.asksven.betterbatterystats_xdaedition"
            if (signingConfigs.debug.storeFile != null) {
                signingConfig signingConfigs.debug
            }
        }
    }

    androidComponents {
        beforeVariants(selector().withFlavor("edition", "gplay").withBuildType("debug")) { variantBuilder ->
            // The Play flavour is only ever shipped as a signed release build.
            variantBuilder.enable = false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            debuggable true
            if (signingConfigs.debug.storeFile != null) {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Backport of java.time / streams APIs to the API 21 baseline.
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/ASL2.0', 'META-INF/DEPENDENCIES']
        }
        jniLibs {
            // Android 15+ devices may use 16 KB memory pages; uncompressed libs page-align correctly.
            useLegacyPackaging = false
        }
    }

    lint {
        abortOnError false
        disable 'MissingTranslation'
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// and a naming policy for the apks
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def flavor = variant.flavorName
            def buildType = variant.buildType
            output.outputFileName.set(
                    output.versionName.map { v -> "betterbatterystats_${flavor}_${buildType}_${v}.apk" as String })
        }
    }
}

/*
 * References are persisted as Java-serialized blobs in SQLite. Java serialization resolves classes
 * and fields by name, so if R8 ever renames one of them, every reference already on a user's device
 * becomes unreadable on update — silently, with no error to trace back to the rename.
 *
 * `proguard-rules.pro` keeps that object graph, but a keep rule is easy to weaken by accident. This
 * task reads what R8 actually did and fails the build if any persisted type or field was renamed.
 */
def verifyPersistedModelNotObfuscated = tasks.register('verifyPersistedModelNotObfuscated') {
    description = 'Fails if R8 renamed a class or field that is persisted by Java serialization.'
    group = 'verification'

    def mappingFiles = fileTree(layout.buildDirectory.dir('outputs/mapping')) { include '**/mapping.txt' }
    inputs.files(mappingFiles).withPropertyName('mappingFiles').skipWhenEmpty()

    doLast {
        // The classes reachable from ReferenceDto, which is what actually goes into the blob.
        def persistedPrefixes = [
                'com.asksven.android.common.dto.',
                'com.asksven.android.common.nameutils.UidInfo',
                'com.asksven.android.common.privateapiproxies.StatElement',
                'com.asksven.betterbatterystats.data.Reference',
                'com.asksven.betterbatterystats.data.ReferenceDto',
        ]
        // Same package or prefix, but runtime-only: never written to disk, safe to rename.
        def runtimeOnly = [
                'com.asksven.betterbatterystats.data.ReferenceDBHelper',
                'com.asksven.betterbatterystats.data.ReferenceStore',
        ]

        def problems = []

        mappingFiles.each { mappingFile ->
            def currentClass = null
            def currentIsPersisted = false

            mappingFile.eachLine { line ->
                if (!line.startsWith(' ') && line.contains(' -> ')) {
                    def (original, obfuscated) = line.trim().replaceAll(':$', '').split(' -> ')
                    currentClass = original
                    currentIsPersisted = persistedPrefixes.any { original.startsWith(it) } &&
                            !runtimeOnly.any { original == it || original.startsWith(it + '$') }

                    if (currentIsPersisted && original != obfuscated) {
                        problems << "class ${original} was renamed to ${obfuscated}"
                    }
                } else if (currentIsPersisted && line.startsWith(' ') && line.contains(' -> ')) {
                    def parts = line.trim().split(' -> ')
                    // methods carry an argument list; only fields matter for serialization
                    if (!parts[0].contains('(')) {
                        def fieldName = parts[0].tokenize(' ').last()
                        if (fieldName != parts[1]) {
                            problems << "field ${currentClass}.${fieldName} was renamed to ${parts[1]}"
                        }
                    }
                }
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException(
                    "R8 renamed persisted model members; saved references would become unreadable " +
                            "on update. Fix the keep rules in proguard-rules.pro:\n  " +
                            problems.join('\n  '))
        }

        logger.lifecycle('Persisted model is intact: no serialized class or field was renamed.')
    }
}

tasks.matching { it.name ==~ /assemble\w*Release/ }.configureEach {
    finalizedBy verifyPersistedModelNotObfuscated
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation files('libs/RootTools-5.0.aar')
    implementation files('libs/RootShell-1.6.aar')

    implementation libs.androidx.activity
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.multidex
    implementation libs.androidx.preference
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.vectordrawable
    implementation libs.androidx.work.runtime

    implementation libs.material
    implementation libs.gson
    implementation libs.jackson.core
    implementation libs.jackson.mapper
    implementation libs.ckchangelog
    implementation libs.dashclock.api

    testImplementation libs.junit
    testImplementation libs.mockito.core

    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.espresso.core
}

def getBuildSuffix() {
    def buildNumber = System.getenv("CIRCLE_BUILD_NUM")
    return buildNumber != null ? "-" + buildNumber : ""
}
