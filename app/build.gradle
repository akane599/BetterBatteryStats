plugins {
    alias(libs.plugins.android.application)
}

// The Play Publisher plugin needs a service-account credentials file that is only present on CI.
// Applying it unconditionally breaks local/offline builds, so it is opt-in.
def playCredentials = file('sa-google-play.json')
if (playCredentials.exists()) {
    apply plugin: 'com.github.triplet.play'
    play {
        track = 'beta'
        serviceAccountCredentials = playCredentials
    }
}

android {
    namespace 'com.asksven.betterbatterystats'
    compileSdk libs.versions.compileSdk.get() as int
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId "com.asksven.betterbatterystats"
        minSdk libs.versions.minSdk.get() as int
        targetSdk libs.versions.targetSdk.get() as int
        versionCode 109
        versionName "3.5.0"
        versionNameSuffix = getBuildSuffix()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        signingConfig signingConfigs.debug
        testBuildType "debug"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_RELEASE") ?: "app.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
        debug {
            if (file(System.getenv("KEYSTORE_DEBUG") ?: "app.keystore").exists()) {
                storeFile = file(System.getenv("KEYSTORE_DEBUG") ?: "app.keystore")
            }
        }
    }

    // we have different package name for the variants
    flavorDimensions += "edition"
    productFlavors {
        gplay {
            dimension "edition"
            applicationId "com.asksven.betterbatterystats"
            signingConfig signingConfigs.release
        }
        xdaedition {
            dimension "edition"
            applicationId "com.asksven.betterbatterystats_xdaedition"
            signingConfig signingConfigs.debug
        }
    }

    androidComponents {
        beforeVariants(selector().withFlavor("edition", "gplay").withBuildType("debug")) { variantBuilder ->
            // The Play flavour is only ever shipped as a signed release build.
            variantBuilder.enable = false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Backport of java.time / streams APIs to the API 21 baseline.
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/ASL2.0', 'META-INF/DEPENDENCIES']
        }
        jniLibs {
            // Android 15+ devices may use 16 KB memory pages; uncompressed libs page-align correctly.
            useLegacyPackaging = false
        }
    }

    lint {
        abortOnError false
        disable 'MissingTranslation'
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// and a naming policy for the apks
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def flavor = variant.flavorName
            def buildType = variant.buildType
            output.outputFileName.set(
                    output.versionName.map { v -> "betterbatterystats_${flavor}_${buildType}_${v}.apk" as String })
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation files('libs/RootTools-5.0.aar')
    implementation files('libs/RootShell-1.6.aar')

    implementation libs.androidx.activity
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.multidex
    implementation libs.androidx.preference
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.vectordrawable
    implementation libs.androidx.work.runtime

    implementation libs.material
    implementation libs.gson
    implementation libs.jackson.core
    implementation libs.jackson.mapper
    implementation libs.ckchangelog
    implementation libs.dashclock.api

    testImplementation libs.junit
    testImplementation libs.mockito.core

    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.espresso.core
}

def getBuildSuffix() {
    def buildNumber = System.getenv("CIRCLE_BUILD_NUM")
    return buildNumber != null ? "-" + buildNumber : ""
}
