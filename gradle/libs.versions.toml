[versions]
# Android Gradle Plugin / SDK levels
agp = "8.13.2"
playPublisher = "3.9.1"
compileSdk = "36"
targetSdk = "36"
minSdk = "24"

# AndroidX
activity = "1.12.4"
appcompat = "1.7.1"
core = "1.17.0"
fragment = "1.8.9"
lifecycle = "2.9.4"
multidex = "2.0.1"
preference = "1.2.1"
recyclerview = "1.4.0"
swiperefreshlayout = "1.2.0"
vectordrawable = "1.2.0"
work = "2.10.5"

# Third party
shizuku = "13.1.5"
gson = "2.11.0"
jackson = "1.9.13"
material = "1.13.0"
ckchangelog = "1.2.2"
dashclock = "2.0.0"

# Test
junit = "4.13.2"
mockito = "5.14.2"
androidxTestJunit = "1.2.1"
androidxTestRules = "1.6.1"
espresso = "3.6.1"

[libraries]
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "lifecycle" }
androidx-test-core = { module = "androidx.test:core", version = "1.6.1" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.6.2" }

androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
androidx-multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-vectordrawable = { module = "androidx.vectordrawable:vectordrawable", version.ref = "vectordrawable" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }

material = { module = "com.google.android.material:material", version.ref = "material" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jackson-core = { module = "org.codehaus.jackson:jackson-core-asl", version.ref = "jackson" }
jackson-mapper = { module = "org.codehaus.jackson:jackson-mapper-asl", version.ref = "jackson" }
ckchangelog = { module = "de.cketti.library.changelog:ckchangelog", version.ref = "ckchangelog" }
dashclock-api = { module = "com.google.android.apps.dashclock:dashclock-api", version.ref = "dashclock" }

junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
play-publisher = { id = "com.github.triplet.play", version.ref = "playPublisher" }
