name: Android build

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test XDA edition
        run: bash ./gradlew :app:assembleXdaeditionDebug :app:assembleXdaeditionRelease :app:testXdaeditionDebugUnitTest :app:lintXdaeditionDebug --stacktrace
      - name: Summarize tests and new backend lint
        if: always()
        run: python scripts/ci_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bbs-test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: BetterBatteryStats-Android16-debug
          path: app/build/outputs/apk/xdaedition/debug/*.apk
          if-no-files-found: error

  android-16-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            bash ./gradlew :app:assembleXdaeditionDebug :app:assembleXdaeditionDebugAndroidTest
            adb install -r app/build/outputs/apk/xdaedition/debug/*.apk
            adb shell pm grant com.asksven.betterbatterystats_xdaedition.modern android.permission.DUMP
            adb shell appops set com.asksven.betterbatterystats_xdaedition.modern GET_USAGE_STATS allow
            bash ./gradlew :app:connectedXdaeditionDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.asksven.betterbatterystats.modern.ModernStatsActivityTest --stacktrace
            adb pull /sdcard/Android/data/com.asksven.betterbatterystats_xdaedition.modern/files/modern-dashboard.png modern-dashboard.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-16-smoke-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            modern-dashboard.png
